<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <p hidden>
        <label>No llenes este campo: <input name="bot-field" /></label>
      </p>
      <label>Nombre <input type="text" name="name" /></label>
      <label>Correo <input type="email" name="email" /></label>
      <label>Mensaje <textarea name="message"></textarea></label>
      <button type="submit">Enviar mensaje</button>
    </form>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
